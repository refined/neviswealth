[project]
name = "advisor-search"
version = "0.1.0"
description = "Search API across wealth-management clients and their documents"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "email-validator>=2.1",
    "fastapi>=0.115",
    "fastembed>=0.4",
    "numpy>=1.26",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency markers are meant to be used as argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Security"]


[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "model: quality evaluation that loads the real embedding model (slow, downloads weights)",
]
addopts = "-m 'not model'"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "psutil>=7.2.2",
    "pytest>=8",
    "ruff>=0.6",
    "testcontainers[postgres]>=4.8",
]
