services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: nevis
      POSTGRES_PASSWORD: nevis
      POSTGRES_DB: nevis
    # Sized for a small (1 vCPU / 4 GB) server.
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=30", "-c", "work_mem=8MB"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nevis -d nevis"]
      interval: 2s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    restart: unless-stopped

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://nevis:nevis@db:5432/nevis
      # Set API_KEY (e.g. in .env) to require an X-API-Key header on every API call.
      API_KEY: ${API_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 1g
    restart: unless-stopped

volumes:
  pgdata:
